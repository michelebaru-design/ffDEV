<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<!-- viewport-fit=cover: fondamentale per iOS notch e home indicator -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Football Friday"/>
<meta name="theme-color" content="#080808"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<title>⚽ Football Friday</title>
<style>
/* ═══ RESET ═══ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;
  --txt:#f0f0f0;--mut:#6b7280;--brd:#1e2a1e;
  --grn:#22c55e;--grn2:#16a34a;--grn3:#14532d;
  --red:#ef4444;--yel:#fbbf24;--blu:#60a5fa;
}
html{height:100%;height:-webkit-fill-available}
body{
  min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;
  overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:"Space Grotesk",-apple-system,sans-serif;
}
button,input,select,textarea{font-family:inherit;cursor:pointer}
input[type=range]{accent-color:var(--grn);width:100%}

/* ═══ LAYOUT ═══ */
#app{display:flex;height:100vh;height:100dvh;}
#sidebar{
  width:220px;background:#0d1f0d;border-right:1px solid var(--brd);
  padding:1.5rem 0;display:none;flex-direction:column;flex-shrink:0;
}
.sb-btn{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  margin:0 8px 2px;border-radius:10px;border:none;
  background:transparent;color:#86efac;font-size:13px;font-weight:500;
  text-align:left;width:calc(100% - 16px);letter-spacing:.3px;
  font-family:"Space Grotesk",sans-serif;
}
.sb-btn.act{background:var(--grn2);color:#fff;font-weight:700;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* ═══ HEADER ═══ */
#mhead{
  background:rgba(10,10,10,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid #1a2a1a;
  padding:10px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.ff-logo{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:2px;color:var(--grn);line-height:1}
.ff-logo-sub{font-size:9px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}

/* ═══ CONTENT ═══ */
#content{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:1rem;padding-bottom:calc(90px + env(safe-area-inset-bottom));
  background:var(--bg);
}

/* ═══ NAV INFERIORE ═══ */
#mnav{
  position:fixed;bottom:0;left:0;right:0;
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  background:rgba(10,10,10,.98);backdrop-filter:blur(20px);
  border-top:1px solid #1a2a1a;
  display:flex;z-index:100;
  box-shadow:0 -4px 20px rgba(0,0,0,.6);
}
.nb{
  flex:1;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  background:none;border:none;padding:8px 4px;
  font-size:9px;font-weight:600;color:var(--mut);
  letter-spacing:.5px;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-height:56px;position:relative;
  font-family:"Space Grotesk",sans-serif;
  transition:color .2s;
}
.nb.act{color:var(--grn)}
.nb.act::after{
  content:'';position:absolute;bottom:0;left:50%;
  transform:translateX(-50%);width:32px;height:3px;
  background:var(--grn);border-radius:99px 99px 0 0;
}
.nb-i{font-size:22px;line-height:1;margin-bottom:1px}

/* ═══ SUBMENU "ALTRO" ═══ */
#submenu{
  position:fixed;bottom:calc(56px + env(safe-area-inset-bottom));
  left:0;right:0;background:rgba(15,15,15,.98);
  backdrop-filter:blur(20px);border-top:1px solid #1a2a1a;
  display:none;flex-wrap:wrap;gap:0;z-index:99;
  box-shadow:0 -4px 20px rgba(0,0,0,.5);
}
#submenu.on{display:flex}
.smb{
  flex:0 0 25%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;padding:14px 4px;border:none;
  background:transparent;color:var(--mut);font-size:9px;font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;
  font-family:"Space Grotesk",sans-serif;
  border-bottom:1px solid #1a2a1a;
}
.smb.act{color:var(--grn)}
.smb-i{font-size:22px}

@media(min-width:768px){
  #sidebar{display:flex!important}
  #mhead,#mnav,#submenu{display:none!important}
  #content{padding-bottom:1rem!important}
}

  border-radius:14px;padding:1rem;margin-bottom:10px;
}
.card-dark{
  background:#0d160d;border:1px solid var(--brd);
  border-radius:14px;padding:1rem;margin-bottom:10px;
}
.card-green{
  background:linear-gradient(135deg,#0d2a0d,#0d1f0d);
  border:1px solid #1e4a1e;
  border-radius:14px;padding:1rem;margin-bottom:10px;
}
.cardg{background:#0d1f0d;border:1px solid var(--brd);border-radius:14px;padding:1rem;margin-bottom:10px}

/* ═══ CARD GIOCATORE GRANDE ═══ */
.player-card{
  background:var(--bg2);border:1px solid #1e2a1e;
  border-radius:16px;padding:14px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
  transition:background .15s;
}
.player-card:active{background:var(--bg3)}
.player-avatar{
  width:56px;height:56px;border-radius:50%;
  object-fit:cover;border:2px solid var(--grn3);flex-shrink:0;
}
.player-avatar-ph{
  width:56px;height:56px;border-radius:50%;
  background:var(--bg3);border:2px solid #1e2a1e;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.player-name{
  font-family:"Space Grotesk",sans-serif;
  font-size:15px;font-weight:700;color:var(--txt);margin-bottom:2px;
}
.player-role{font-size:11px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.player-stats{display:flex;gap:10px;margin-top:6px}
.pstat{text-align:center}
.pstat-val{font-size:15px;font-weight:700;color:var(--txt)}
.pstat-lbl{font-size:9px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.player-xp-bar{
  height:3px;background:#1e2a1e;border-radius:99px;margin-top:6px;overflow:hidden;
}
.player-xp-fill{height:100%;background:var(--grn);border-radius:99px;transition:width .5s ease}
.player-level{
  font-size:10px;font-weight:700;color:var(--grn);
  letter-spacing:.5px;text-transform:uppercase;margin-left:auto;
  display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;
}
.player-level-num{font-size:22px;font-weight:900;line-height:1}

/* ═══ DASHBOARD HOME ═══ */
.dash-section{margin-bottom:6px}
.dash-label{
  font-size:10px;font-weight:700;color:var(--mut);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat-box{
  background:var(--bg2);border:1px solid #1e2a1e;border-radius:12px;
  padding:12px 8px;text-align:center;
}
.stat-box-val{font-size:26px;font-weight:900;color:var(--txt);line-height:1}
.stat-box-lbl{font-size:9px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.stat-box-icon{font-size:18px;margin-bottom:4px}

/* ═══ PARTITA BANNER ═══ */
.match-banner{
  background:linear-gradient(135deg,#0d2a0d,#0a1f0a);
  border:1px solid var(--grn3);border-radius:14px;
  padding:14px;margin-bottom:10px;position:relative;overflow:hidden;
}
.match-banner::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--grn2),var(--grn));
}
.match-banner-live{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:700;color:var(--grn);letter-spacing:1px;
  text-transform:uppercase;margin-bottom:6px;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:pulse-dot 1.5s infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* ═══ SCORE DISPLAY ═══ */
.score-display{
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:12px 0;
}
.score-team{font-size:13px;font-weight:600;color:var(--mut);text-align:center;flex:1}
.score-val{font-family:"Bebas Neue",sans-serif;font-size:52px;color:var(--txt);line-height:1}
.score-sep{font-family:"Bebas Neue",sans-serif;font-size:32px;color:var(--mut)}

/* ═══ GRIGLIA ═══ */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}

/* ═══ BUTTONS ═══ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:10px;padding:9px 18px;
  font-size:13px;font-weight:700;color:#fff;
  font-family:"Space Grotesk",sans-serif;letter-spacing:.3px;
  transition:opacity .15s,transform .1s;
}
.btn:active{opacity:.8;transform:scale(.97)}
.btn:disabled{opacity:.35}
.bg{background:var(--grn2)}.br{background:#dc2626}.bgr{background:#1e2a1e}
.bsm{padding:6px 14px;font-size:12px}
.bfw{width:100%;justify-content:center}

/* ═══ BADGE ═══ */
.bdg{font-size:10px;padding:3px 8px;border-radius:99px;font-weight:700;display:inline-block;letter-spacing:.3px}
.bdgg{background:#0d2a0d;color:var(--grn);border:1px solid var(--grn3)}
.bdgr{background:#2a0d0d;color:#f87171;border:1px solid #7f1d1d}
.bdgy{background:#2a1d0d;color:var(--yel);border:1px solid #713f12}
.bdgx{background:var(--bg3);color:var(--mut);border:1px solid #374151}

/* ═══ INPUT ═══ */
.inp{
  background:var(--bg3);border:1px solid #2a3a2a;border-radius:10px;
  padding:10px 13px;color:var(--txt);font-size:14px;outline:none;width:100%;
  font-family:"Space Grotesk",sans-serif;
}
.inp:focus{border-color:var(--grn2)}

/* ═══ ROW ═══ */
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px;padding:4px 0}
.row span:first-child{color:var(--mut)}

/* ═══ OVERLAY / MODAL ═══ */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:200;padding:0;
}
@media(min-width:768px){.ov{align-items:center;padding:16px}}
.mod{
  background:#111;border:1px solid #1e2a1e;
  border-radius:20px 20px 0 0;width:100%;max-width:440px;
  max-height:90vh;overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:768px){.mod{border-radius:20px}}

/* ═══ MISC ═══ */
.warn{background:#1a1000;border:1px solid #713f12;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--yel);margin-bottom:10px}
.muted{color:var(--mut);font-size:13px}
.anti{background:#1a0d00;border:1px solid #713f12;border-radius:12px;padding:1rem;margin-bottom:8px}
.section-title{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:2px;color:var(--txt);margin-bottom:12px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
/* Giornale */
.gz-bg{background:#F8DDD6;color:#1a1a1a;min-height:100%;margin:-1rem;padding-bottom:2rem}
.gz-red{color:#E30613}
.gz-head{font-family:Impact,'Arial Black','Arial Narrow',sans-serif;letter-spacing:-1px;text-transform:uppercase;line-height:1}
</style>

<body>
<div id="root"></div>
<script>
/* ═══════════════════════════════════════
   🔑 CHIAVI — salvate in localStorage (non nel codice)
═══════════════════════════════════════ */
function getGroqKey(){return localStorage.getItem('ff_groq_key')||'';}
function setGroqKey(k){localStorage.setItem('ff_groq_key',k.trim());}
let GROQ_KEY=getGroqKey(); // letta da localStorage — mai nel codice
const CAPTAIN_PIN='123456';
const BIANCHI='Bianchi',NERI='Neri';


/* ═══════════════════════════════════════
   🎮 SISTEMA RPG — LIVELLI E XP
═══════════════════════════════════════ */
const XP_TABLE=[
  {lv:1,name:'Pivetto',    xp:0},
  {lv:2,name:'Riserva',    xp:500},
  {lv:3,name:'Panchinaro', xp:1000},
  {lv:4,name:'Titolare',   xp:1800},
  {lv:5,name:'Jolly',      xp:2800},
  {lv:6,name:'Veterano',   xp:4000},
  {lv:7,name:'Leader',     xp:5500},
  {lv:8,name:'Capitano',   xp:7200},
  {lv:9,name:'Campione',   xp:9000},
  {lv:10,name:'Leggenda',  xp:11000},
];
const XP_RULES={
  presenza:100, vittoria:150, pareggio:50,
  golAttaccante:80, golCentrocampista:150, golDifensore:200, golPortiere:300,
  parataDec:150,
  golSubiti_02:200, golSubiti_34:100, golSubiti_5:30,
  autorete:-150, rigoreFallito:-100,
};

function getLevelInfo(xp){
  let cur=XP_TABLE[0],next=XP_TABLE[1];
  for(let i=XP_TABLE.length-1;i>=0;i--){
    if(xp>=XP_TABLE[i].xp){cur=XP_TABLE[i];next=XP_TABLE[i+1]||null;break;}
  }
  const pct=next?Math.round((xp-cur.xp)/(next.xp-cur.xp)*100):100;
  return{...cur,next,pct,xp};
}

function calcPlayerXP(playerId){
  const p=S.players.find(x=>x.id===playerId);
  if(!p)return 0;
  let xp=0;

  // Storia completa dai dati cumulativi
  xp+=p.G*XP_RULES.presenza;
  xp+=p.V*XP_RULES.vittoria;
  xp+=p.P*XP_RULES.pareggio;

  // Gol pesati per ruolo (storia completa)
  const goalRule=p.role==='Attaccante'?XP_RULES.golAttaccante:
                 p.role==='Centrocampista'?XP_RULES.golCentrocampista:
                 p.role==='Difensore'?XP_RULES.golDifensore:XP_RULES.golPortiere;
  xp+=p.GF*goalRule;

  // Dati da partite Firebase: MVP, portiere gol subiti, eventi speciali
  S.matches.forEach(m=>{
    if(m.players?.[playerId]!=='confirmed')return;
    if(p.role==='Portiere'){
      const onA=m.teamA?.includes(playerId);
      const conceded=onA?(m.scoreB||0):(m.scoreA||0);
      xp+=conceded<=2?XP_RULES.golSubiti_02:conceded<=4?XP_RULES.golSubiti_34:XP_RULES.golSubiti_5;
    }
    if(m.ratings?.[playerId]?.ownGoals)xp+=XP_RULES.autorete*(m.ratings[playerId].ownGoals);
    if(m.ratings?.[playerId]?.penMiss)xp+=XP_RULES.rigoreFallito*(m.ratings[playerId].penMiss);
    if(m.ratings?.[playerId]?.saveDec)xp+=XP_RULES.parataDec*(m.ratings[playerId].saveDec);
  });

  return Math.max(0,xp);
}

function calcBadges(playerId){
  const p=S.players.find(x=>x.id===playerId);
  if(!p)return[];
  const badges=[];
  // Esordiente — prima presenza
  const partecipato=S.matches.some(m=>m.players?.[playerId]==='confirmed');
  if(p.G>0||partecipato)badges.push({e:'👶',n:'Esordiente',d:'Prima presenza'});
  // Fedele — 30 presenze
  if(p.G>=30)badges.push({e:'💎',n:'Fedele',d:'30+ presenze stagione'});
  // Cecchino — 25 gol stagione
  if(p.GF>=25)badges.push({e:'🎯',n:'Cecchino',d:'25+ gol stagione'});
  // Fulmine — 5 gol in una partita
  const hasFulmine=S.matches.some(m=>(m.ratings?.[playerId]?.goals||0)>=5);
  if(hasFulmine)badges.push({e:'⚡',n:'Fulmine',d:'5+ gol in una partita'});
  // On Fire — 3 MVP consecutivi
  let mvpStreak=0;
  for(const m of [...S.matches].sort((a,b)=>{
    const pa=a.date?a.date.split('/').reverse().join(''):0;
    const pb=b.date?b.date.split('/').reverse().join(''):0;
    return pb.localeCompare(pa);
  })){
    if(m.mvp===playerId)mvpStreak++;
    else break;
  }
  if(mvpStreak>=3)badges.push({e:'🔥',n:'On Fire',d:'3 MVP consecutivi'});
  return badges;
}

/* ═══════════════════════════════════════
   ☁️ CLOUD — Firebase Realtime Database
   • Letture: pubbliche (regole .read:true)
   • Scritture: autenticate con il segreto DB
   • CORS garantito su tutti i browser/dispositivi
═══════════════════════════════════════ */
let FB_URL = localStorage.getItem('ff_fb_url')||'';
let FB_SEC = localStorage.getItem('ff_fb_sec')||'';
const FB_PATH='/ff.json';

/* Auto-collegamento da link condiviso (?db=URL) */
(()=>{
  const p=new URLSearchParams(location.search).get('db');
  if(p){const u=decodeURIComponent(p);if(u!==FB_URL){FB_URL=u;localStorage.setItem('ff_fb_url',u);}}
})();

async function npRead(){
  if(!FB_URL)return null;
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch(`${FB_URL}${FB_PATH}?_=${Date.now()}`,{cache:'no-store',signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok){S._npErr=`HTTP ${r.status}`;return null;}
    const d=await r.json();S._npErr=null;
    return (d&&Array.isArray(d.players)&&d.players.length>0)?d:null;
  }catch(e){S._npErr=e.message;return null;}
}

async function npWrite(data){
  if(!FB_URL||!FB_SEC)return;
  try{
    await fetch(`${FB_URL}${FB_PATH}?auth=${FB_SEC}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
  }catch(e){}
}

/* Setup: il capitano inserisce URL + Segreto → testa + genera link gruppo */
async function npSetup(){
  const url=(document.getElementById('fb-url')||{}).value?.trim();
  const sec=(document.getElementById('fb-sec')||{}).value?.trim();
  if(!url||!sec){alert('Inserisci URL database e Segreto');return;}
  const btn=document.getElementById('btn-setup');
  if(btn){btn.innerHTML='<span class="spin">⏳</span> Connessione...';btn.disabled=true;}
  try{
    const r=await fetch(`${url}${FB_PATH}?auth=${sec}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({players:S.players,matches:S.matches,current:S.match||null})
    });
    if(!r.ok)throw new Error(`HTTP ${r.status} — verifica URL e Segreto`);
    FB_URL=url;FB_SEC=sec;
    localStorage.setItem('ff_fb_url',FB_URL);
    localStorage.setItem('ff_fb_sec',FB_SEC);
    const shareUrl=`${location.origin}${location.pathname}?db=${encodeURIComponent(FB_URL)}`;
    localStorage.setItem('ff_shareurl',shareUrl);
    render();
    setTimeout(()=>alert(
      '✅ Cloud attivato!\n\n'+
      '📤 LINK DA MANDARE AL GRUPPO:\n\n'+shareUrl+'\n\n'+
      'I membri aprono questo link una volta sola e si connettono automaticamente.'
    ),100);
  }catch(e){
    if(btn){btn.innerHTML='❌ Errore';btn.disabled=false;}
    alert('Errore: '+e.message);
  }
}

let syncT=null;
function syncCloud(){
  clearTimeout(syncT);
  syncT=setTimeout(async()=>{
    await npWrite({players:S.players,matches:S.matches,current:S.match||null,
      seasons:S.seasons,seasonName:S.seasonName});
    S.lastSync=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    const el=document.getElementById('sync-lbl');if(el)el.textContent='📡 '+S.lastSync;
  },1500);
}

/* Scrittura pubblica senza segreto — usata dai membri per auto-convocazione.
   Funziona con Firebase in modalità test (30gg) o con regole .write:true sul path. */
async function npWritePublic(data){
  if(!FB_URL)return;
  try{await fetch(`${FB_URL}${FB_PATH}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}catch(e){}
}

/* ═══════════════════════════════════════
   COSTANTI & DATI DEMO
═══════════════════════════════════════ */
const ROLES=['Portiere','Difensore','Centrocampista','Attaccante'];

/* ═══════════════════════════════════════
   AI (GROQ)
═══════════════════════════════════════ */
async function ai(msg,sys){
  GROQ_KEY=getGroqKey(); // rilegge sempre da localStorage
  if(!GROQ_KEY){
    const k=prompt('🔑 Inserisci la tua Groq API Key\n(console.groq.com → API Keys)\n\nViene salvata solo su questo dispositivo:');
    if(!k||!k.trim()){throw new Error('Chiave API non inserita');}
    setGroqKey(k);GROQ_KEY=k.trim();
  }
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
    body:JSON.stringify({model:'llama-3.3-70b-versatile',max_tokens:1500,
      messages:[...(sys?[{role:'system',content:sys}]:[]),{role:'user',content:msg}]})});
  const d=await r.json();
  if(d.error){
    if(d.error.code==='invalid_api_key'||d.error.status===401){
      localStorage.removeItem('ff_groq_key');GROQ_KEY='';
      throw new Error('❌ Chiave API non valida — verrà richiesta di nuovo al prossimo utilizzo.');
    }
    throw new Error(d.error.message);
  }
  return d.choices?.[0]?.message?.content||'';
}

function cambiaGroqKey(){
  const attuale=getGroqKey();
  const msg=attuale
    ?'🔑 Chiave API Groq attuale:\n'+attuale.slice(0,12)+'••••••••\n\nNuova chiave (vuoto per cancellare):'
    :'🔑 Inserisci la tua Groq API Key:\n(console.groq.com → API Keys)';
  const k=prompt(msg,'');
  if(k===null)return;
  if(k.trim()===''){localStorage.removeItem('ff_groq_key');GROQ_KEY='';alert('🗑️ Chiave rimossa.');}
  else{setGroqKey(k);GROQ_KEY=k.trim();alert('✅ Chiave salvata!');}
  render();
}

function calcMediaP(p){return p.G>0?+((p.V*3+p.P)/p.G).toFixed(3):0;}

/* Restituisce data odierna in formato YYYY-MM-DD basata sul fuso LOCALE
   (toISOString darebbe la data UTC: di notte in Italia mostrerebbe ieri) */
function todayLocal(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function matchScorers(m){
  if(!m||!m.ratings)return[];
  return Object.entries(m.ratings)
    .filter(([,r])=>(r.goals||0)>0)
    .sort((a,b)=>b[1].goals-a[1].goals)
    .map(([id,r])=>{
      const p=S.players.find(x=>x.id===id);
      if(!p)return null;
      const team=m.teamA?.includes(id)?'⚪':'⚫';
      return `${team} ${p.name}${r.goals>1?` ×${r.goals}`:''}`;
    }).filter(Boolean);
}

function matchEvents(m){
  // Restituisce eventi speciali: autoreti, rigori falliti, parate decisive
  if(!m||!m.ratings)return[];
  const events=[];
  Object.entries(m.ratings).forEach(([id,r])=>{
    const p=S.players.find(x=>x.id===id);
    if(!p)return;
    if(r.ownGoals>0)events.push(`🔴 ${p.name}${r.ownGoals>1?' ×'+r.ownGoals:''} (autorete)`);
    if(r.penMiss>0)events.push(`❌ ${p.name}${r.penMiss>1?' ×'+r.penMiss:''} (rig. fallito)`);
    if(r.saveDec>0)events.push(`🧤 ${p.name} (parata dec.)`);
  });
  return events;
}

function shareWhatsApp(){
  if(!S.match||!S.match.teamA?.length)return;
  const tA=S.players.filter(p=>S.match.teamA.includes(p.id));
  const tB=S.players.filter(p=>S.match.teamB.includes(p.id));
  const fmA=formLabel(tA),fmB=formLabel(tB);
  const link=localStorage.getItem('ff_shareurl')||location.href;
  const gruppoA=ROLES.map(r=>{const ps=tA.filter(p=>p.role===r);return ps.length?`${RICON[r]} ${ps.map(p=>p.name).join(', ')}`:null;}).filter(Boolean).join('\n');
  const gruppoB=ROLES.map(r=>{const ps=tB.filter(p=>p.role===r);return ps.length?`${RICON[r]} ${ps.map(p=>p.name).join(', ')}`:null;}).filter(Boolean).join('\n');
  const msg=
    `⚽ *FOOTBALL FRIDAY — ${S.match.date}*\n\n`+
    `⚪ *BIANCHI* [${fmA}]\n${gruppoA}\n\n`+
    `⚫ *NERI* [${fmB}]\n${gruppoB}\n\n`+
    `📺 Vedi il campo: ${link}`;
  if(navigator.share){
    navigator.share({text:msg}).catch(()=>copyToClipboard(msg));
  }else{
    copyToClipboard(msg);
  }
}

function copyToClipboard(text){
  navigator.clipboard?.writeText(text)
    .then(()=>alert('✅ Messaggio copiato! Incollalo su WhatsApp.'))
    .catch(()=>{
      /* fallback per Safari */
      const ta=document.createElement('textarea');
      ta.value=text;document.body.appendChild(ta);ta.select();
      document.execCommand('copy');document.body.removeChild(ta);
      alert('✅ Messaggio copiato! Incollalo su WhatsApp.');
    });
}

/* ─── STAGIONI ──────────────────────────────────────────────── */

function startNewSeason(){
  const name=prompt('Nome da dare alla stagione che si chiude (es. 2024-25):',S.seasonName)||S.seasonName;
  if(!confirm(`Archiviare la stagione "${name}" e iniziarne una nuova?\n\nLe statistiche attuali vengono conservate nell'archivio.`))return;
  /* Archivia stagione corrente */
  S.seasons.unshift({
    name,
    date:new Date().toLocaleDateString('it-IT'),
    matches:[...S.matches],
    players:S.players.map(p=>({...p})),
    totalGoals:S.players.reduce((s,p)=>s+p.GF,0),
    topScorer:[...S.players].sort((a,b)=>b.GF-a.GF)[0]?.name||'',
    topWins:[...S.players].sort((a,b)=>b.V-a.V)[0]?.name||'',
    topPresenze:[...S.players].sort((a,b)=>b.G-a.G)[0]?.name||'',
  });
  /* Salva carryXP storico per bilanciamento AI nuova stagione
     (non si azzera mai — tiene memoria storica del valore del giocatore) */
  S.players=S.players.map(p=>{
    const xpOld=calcPlayerXP(p.id);
    const carryOld=p.carryXP||0;
    // Media pesata: 60% stagione appena finita + 40% storico precedente
    const newCarry=Math.round(xpOld*0.6+carryOld*0.4);
    return {...p,G:0,V:0,P:0,S:0,GF:0,GS:0,carryXP:newCarry};
  });
  S.matches=[];S.match=null;
  S.seasonName=new Date().getFullYear().toString();
  localStorage.setItem('ff_seasons',JSON.stringify(S.seasons));
  localStorage.setItem('ff_season_name',S.seasonName);
  savePl();saveMs();saveCm();
  alert(`✅ Stagione "${name}" archiviata! Nuova stagione ${S.seasonName} iniziata.`);
  S.showPinModal=false;render();
}

function go(t){
  const ok=S.captainMode?['home','rosa','nuovo','convoca','partita','stadio','giornale','figurine','gloria','stats','rpg']:['home','rosa','stadio','giornale','figurine','gloria','stats','rpg'];

function toggleAltro(){
  const sm=document.getElementById('submenu');

}
function closeAltro(){
  const sm=document.getElementById('submenu');

}

function checkPin(){
  const v=(document.getElementById('pin-inp')||{}).value||'';
  if(v===CAPTAIN_PIN){
    S.captainMode=true;localStorage.setItem('ff_captain','true');S.showPinModal=false;
    /* Se questo dispositivo ha FB_URL ma non FB_SEC (es. apertura dal link gruppo),
       chiedi il segreto Firebase per poter salvare le modifiche */
    if(FB_URL&&!FB_SEC){
      const sec=prompt('📱 Primo accesso capitano su questo dispositivo.\n\nInserisci il Segreto Database Firebase\n(lo trovi su console.firebase.google.com → Impostazioni → Account di servizio → Segreti database):');
      if(sec&&sec.trim()){FB_SEC=sec.trim();localStorage.setItem('ff_fb_sec',FB_SEC);}
    }
    syncCloud();render();
  }else{
    const el=document.getElementById('pin-inp');
    if(el){el.style.borderColor='#dc2626';el.value='';el.placeholder='PIN errato!';}

function exitCaptain(){S.captainMode=false;localStorage.removeItem('ff_captain');S.showPinModal=false;if(!['home','stadio','giornale'].includes(S.tab))S.tab='home';render();}

    `<div class="card" style="text-align:center;border:1px dashed #1e2a1e;background:transparent">
      <div style="color:var(--mut);font-size:13px;margin-bottom:${S.captainMode?'10px':'0'}">Nessuna partita programmata</div>

      ${ta?.G>0?`<div class="row"><span>📅 Più presenze</span><span style="color:var(--txt);font-weight:600">${ta.name} (${ta.G}G)</span></div>`:''}
      ${tmp?`<div class="row"><span>📊 Miglior media</span><span style="color:var(--txt);font-weight:600">${tmp.name} (${calcMediaP(tmp).toFixed(3)})</span></div>`:''}

    <!-- REFRESH MEMBRI -->

async function refreshData(){
  const btn=document.getElementById('btn-refresh');
  if(btn){btn.innerHTML='<span class="spin">⏳</span> Caricamento...';btn.disabled=true;}
  const cloud=await npRead();
  if(cloud&&cloud.players&&cloud.players.length>0){
    S.players=cloud.players;S.matches=cloud.matches||[];S.match=cloud.current||null;
    S.lastSync=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    localStorage.setItem('ff_pl',JSON.stringify(S.players));
    localStorage.setItem('ff_ms',JSON.stringify(S.matches));
    S.match?localStorage.setItem('ff_cm',JSON.stringify(S.match)):localStorage.removeItem('ff_cm');
    render();
  }else{
    const errMsg=S._npErr?`❌ ${S._npErr}`:'❌ Nessun dato';
    if(btn){btn.innerHTML=errMsg;btn.disabled=false;}
    setTimeout(()=>{if(!S.captainMode&&FB_URL)refreshData();},5000);
  }
}

function pgRosa(){return `<div style="max-width:640px;margin:0 auto">
  <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
    <input class="inp" style="flex:1" placeholder="🔍 Cerca..." value="${S.pFilter}"
      oninput="S.pFilter=this.value;document.getElementById('plist').innerHTML=rosaList()"/>

  </div>
  <div style="display:flex;gap:6px;margin-bottom:10px">
    <button onclick="S.rosaFilter='all';document.getElementById('plist').innerHTML=rosaList()"
      style="padding:4px 12px;border-radius:99px;border:none;font-size:11px;font-weight:600;cursor:pointer;
      background:${S.rosaFilter!=='inactive'?'var(--grn2)':'var(--bg3)'};color:${S.rosaFilter!=='inactive'?'#fff':'var(--mut)'}">
      👥 Attivi (${S.players.filter(p=>!p.inactive).length})</button>
    <button onclick="S.rosaFilter='inactive';document.getElementById('plist').innerHTML=rosaList()"
      style="padding:4px 12px;border-radius:99px;border:none;font-size:11px;font-weight:600;cursor:pointer;
      background:${S.rosaFilter==='inactive'?'#374151':'var(--bg3)'};color:${S.rosaFilter==='inactive'?'#fff':'var(--mut)'}">

  </div>
  <div id="plist">${rosaList()}</div>
</div>`;}

function rosaList(){
  const fl=S.pFilter.toLowerCase();
  const showInactive=S.rosaFilter==='inactive';
  const list=S.players.filter(p=>{
    if(!p.name.toLowerCase().includes(fl))return false;
    return showInactive?p.inactive:!p.inactive;
  });
  if(!list.length)return `<div class="muted" style="text-align:center;padding:2rem">${showInactive?'Nessun giocatore inattivo':'Nessun giocatore attivo'}</div>`;
  return ROLES.map(role=>{
    const ps=list.filter(p=>p.role===role);if(!ps.length)return'';
    return `<div style="margin-bottom:4px">
      <div style="font-size:11px;color:#9ca3af;letter-spacing:1px;margin-bottom:4px;padding:0 4px">${RICON[role]} ${role.toUpperCase()}</div>
      ${ps.map(p=>{
        const ph=playerPhoto(p.name);
        return `<div style="background:var(--bg2);border:1px solid ${p.inactive?'#2a1a1a':'#1e2a1e'};border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:6px;opacity:${p.inactive?'.6':'1'}">
          <div style="width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid ${p.inactive?'#374151':'var(--grn3)'}">
            <img src="cards/${ph}" style="width:100%;height:100%;object-fit:cover" onerror="this.hidden=true"/>
            ${RICON[p.role]}
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px">
              <div style="font-weight:700;font-size:14px">${p.name}</div>
              ${p.inactive?'<span style="font-size:9px;background:#2a1a1a;color:#f87171;border-radius:99px;padding:1px 6px;font-weight:700">INATTIVO</span>':''}
              ${!p.hasCard&&!p.inactive?'<span style="font-size:9px;background:var(--bg3);color:var(--mut);border-radius:99px;padding:1px 6px">no card</span>':''}
            </div>
            <div style="display:flex;gap:8px;margin-top:3px;font-size:11px;color:#6b7280;flex-wrap:wrap">
              <span>G:${p.G}</span><span>V:${p.V}</span><span>P:${p.P}</span><span>S:${p.S}</span>
              <span style="color:#fbbf24">⚽${p.GF}</span>
              ${p.note?`<span style="color:var(--mut);font-style:italic">${p.note}</span>`:''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;align-items:flex-end">
            ${S.captainMode?`<button onclick="openEditP('${p.id}')" style="padding:5px;background:none;border:none;color:#60a5fa;font-size:16px">✏️</button>
            ${p.inactive?
              `<button onclick="toggleInactive('${p.id}')" style="padding:5px;background:none;border:none;color:var(--grn);font-size:13px;font-weight:700">✅</button>`:
              `<button onclick="toggleInactive('${p.id}')" style="padding:5px;background:none;border:none;color:#f87171;font-size:13px;font-weight:700">💤</button>`
            }`:''}
          </div>
        </div>`;
      }).join('')}</div>`;}).join('');}

function openEditP(id){S.editP={...S.players.find(p=>p.id===id)};render();}
function delP(id){
  if(!confirm('Eliminare?'))return;
  S.players=S.players.filter(p=>p.id!==id);
  // Pulizia riferimenti nel match attivo per evitare ID pendenti
  if(S.match){
    if(S.match.players)delete S.match.players[id];
    if(S.match.teamA)S.match.teamA=S.match.teamA.filter(x=>x!==id);
    if(S.match.teamB)S.match.teamB=S.match.teamB.filter(x=>x!==id);
    if(S.match.ratings)delete S.match.ratings[id];
    saveCm();
  }
  savePl();render();
}
function closeModal(){S.editP=null;render();}
function toggleInactive(id){
  S.players=S.players.map(p=>p.id===id?{...p,inactive:!p.inactive}:p);
  savePl();render();
}
function savePlayer(){
  const n=document.getElementById('pe-name').value.trim();if(!n){alert('Inserisci il nome');return;}
  S.editP.name=n;
  ['G','V','P','S','GF','GS'].forEach(k=>S.editP[k]=Math.max(0,+document.getElementById('pe-'+k).value||0));
  S.editP.note=document.getElementById('pe-note').value||'';
  if(typeof S.editP.hasCard==='undefined')S.editP.hasCard=true;
  S.players=S.players.find(x=>x.id===S.editP.id)?S.players.map(x=>x.id===S.editP.id?{...S.editP}:x):[...S.players,{...S.editP}];
  savePl();S.editP=null;render();
}

  saveCm();render();
}
function cancelMatch(){
  const ph=S.match?.phase;
  const msg=ph==='attendance'
    ?'Annullare la convocazione?'
    :'⚠️ ATTENZIONE: la partita è già in corso. Tutti i dati di squadre e risultati verranno persi.\n\nAnnullare comunque?';
  if(confirm(msg)){S.match=null;saveCm();render();}
}
function toggleAtt(id){
  const cur=S.match.players[id]||'pending';
  S.match.players[id]=cur==='pending'?'confirmed':cur==='confirmed'?'absent':cur==='absent'?'waiting':'pending';
  saveCm();document.getElementById('content').innerHTML=pgConvoca();
}

function selectSwap(id){S.swapSel=id;const el=document.getElementById('content');if(el)el.innerHTML=S.tab==='stadio'?pgStadio():pgPartita();}
function clearSwap(){S.swapSel=null;const el=document.getElementById('content');if(el)el.innerHTML=S.tab==='stadio'?pgStadio():pgPartita();}
function doSwap(id2){
  const id1=S.swapSel;
  if(S.match.teamA.includes(id1)&&S.match.teamB.includes(id2)){S.match.teamA=S.match.teamA.map(x=>x===id1?id2:x);S.match.teamB=S.match.teamB.map(x=>x===id2?id1:x);}
  else if(S.match.teamB.includes(id1)&&S.match.teamA.includes(id2)){S.match.teamB=S.match.teamB.map(x=>x===id1?id2:x);S.match.teamA=S.match.teamA.map(x=>x===id2?id1:x);}
  S.swapSel=null;saveCm();const el=document.getElementById('content');if(el)el.innerHTML=S.tab==='stadio'?pgStadio():pgPartita();
}
function pitchClick(pid){
  if(!S.captainMode||!S.match||!S.match.teamA?.length)return;
  const sw=S.swapSel;
  if(!sw){selectSwap(pid);}else if(sw===pid){clearSwap();}
  else{const swA=S.match.teamA.includes(sw),pidA=S.match.teamA.includes(pid);
    if(swA!==pidA){doSwap(pid);}else{selectSwap(pid);}
  }
}

async function genTeams(){
  if(S.loading==='teams')return;S.loading='teams';document.getElementById('content').innerHTML=pgTeams();
  const conf=Object.entries(S.match.players).filter(([,s])=>s==='confirmed').map(([id])=>id);
  const confP=S.players.filter(p=>conf.includes(p.id));const n=confP.length,half=Math.floor(n/2);
  try{
    // Calcola dati avanzati per ogni giocatore
    const info=confP.map(p=>{
      const xpStagione=calcPlayerXP(p.id);
      // Se stagione appena iniziata (pochi dati), usa carryXP storico per bilanciamento
      const xpBilancio=xpStagione>0?xpStagione:(p.carryXP||0);
      const lv=getLevelInfo(xpBilancio);
      const res=playerMatchResults(p.id).slice(0,3);
      const forma=res.map(r=>r.r).join('');
      const media=calcMediaP(p);
      return {
        id:p.id,
        name:p.name,
        role:p.role,
        xp:xpBilancio,
        xpStagione:xpStagione,
        carryXP:p.carryXP||0,
        level:lv.lv,
        levelName:lv.name,
        media:media.toFixed(3),
        forma:forma||'---',
        G:p.G,V:p.V,GF:p.GF
      };
    });
    const nuovaStagione=confP.every(p=>p.G<=3); // stagione appena iniziata
    const totalXP=info.reduce((s,p)=>s+p.xp,0);
    const targetXP=Math.round(totalXP/2);

    const txt=await ai(
      `Dividi TUTTI questi ${n} giocatori in DUE SQUADRE BILANCIATE per una partita di calcetto.\n`+
      `REGOLA ASSOLUTA: teamA ESATTAMENTE ${half} ID, teamB ESATTAMENTE ${n-half} ID. Nessun duplicato.\n\n`+
      (nuovaStagione?`NOTA: Stagione appena iniziata. Usa carryXP (storico stagioni precedenti) per valutare la forza dei giocatori.\n\n`:'')+
      `CRITERI DI BILANCIAMENTO (in ordine di priorità):\n`+
      `1. XP (peso 40%): target ${targetXP} XP per squadra${nuovaStagione?' — usa campo carryXP':''}\n`+
      `2. RUOLI (peso 30%): ogni squadra deve avere almeno 1 portiere e ruoli bilanciati\n`+
      `3. FORMA RECENTE (peso 20%): distribuisci chi è in forma (VVV) tra le due squadre\n`+
      `4. MEDIA PUNTI (peso 10%): bilancia le medie complessive\n\n`+
      `Giocatori disponibili:\n${JSON.stringify(info,null,2)}\n\n`+
      `Rispondi SOLO con JSON valido:\n`+
      `{"teamA":[...${half} id],"teamB":[...${n-half} id],"explanation":"spiegazione anti-polemica 2-3 frasi che cita XP e ruoli"}`,
      'Sei un assistente per tornei di calcetto amatoriale. Bilancia le squadre usando XP, ruoli e forma recente. Rispondi solo con JSON valido senza markdown.'
    );
    const d=JSON.parse(txt.replace(/```json|```/g,'').trim());
    const [fixedA,fixedB]=fixTeams(d.teamA||[],d.teamB||[],conf);
    S.match.teamA=fixedA;S.match.teamB=fixedB;S.match.teamExpl=d.explanation||'';saveCm();
  }catch(e){const [a,b]=balancedSplit(confP);S.match.teamA=a;S.match.teamB=b;S.match.teamExpl='Squadre create con algoritmo bilanciato (XP e ruoli).';saveCm();}
  S.loading='';document.getElementById('content').innerHTML=pgTeams();
}
function fixTeams(rawA,rawB,confIds){
  const valid=new Set(confIds);let a=[...new Set(rawA)].filter(x=>valid.has(x));let b=[...new Set(rawB)].filter(x=>valid.has(x));
  const inA=new Set(a);b=b.filter(x=>!inA.has(x));
  confIds.filter(x=>!inA.has(x)&&!b.includes(x)).forEach(x=>a.length<=b.length?a.push(x):b.push(x));
  while(a.length>b.length+1)b.unshift(a.pop());while(b.length>a.length+1)a.unshift(b.pop());return [a,b];
}
function balancedSplit(players){
  // Fallback senza AI — usa XP per bilanciare (serpentina per ruolo)
  const a=[],b=[];
  ROLES.forEach(role=>{
    const ps=[...players.filter(p=>p.role===role)]
      .sort((x,y)=>calcPlayerXP(y.id)-calcPlayerXP(x.id));
    ps.forEach((p,i)=>(i%4===0||i%4===3)?a.push(p.id):b.push(p.id));
  });
  while(a.length>b.length+1)b.unshift(a.pop());
  while(b.length>a.length+1)a.unshift(b.pop());
  return [a,b];
}

function formLabel(ps){const c={P:0,D:0,C:0,A:0};ps.forEach(p=>{if(p.role==='Portiere')c.P++;else if(p.role==='Difensore')c.D++;else if(p.role==='Centrocampista')c.C++;else c.A++;});return `${c.P}-${c.D}-${c.C}-${c.A}`;}

function calcPos(players,side){
  const n=players.length;
  const prio={Portiere:0,Difensore:1,Centrocampista:2,Attaccante:3};
  const sorted=[...players].sort((a,b)=>prio[a.role]-prio[b.role]);
  let slots;
  if(n>=8){slots=[[4,50],[17,15],[17,50],[17,85],[30,15],[30,50],[30,85],[40,50]];for(let i=8;i<n;i++)slots.push([23,15+(i-8)*18]);}
  else if(n===7){slots=[[4,50],[17,15],[17,50],[17,85],[30,28],[30,72],[40,50]];}
  else if(n===6){slots=[[4,50],[17,25],[17,75],[30,25],[30,75],[40,50]];}
  else if(n===5){slots=[[4,50],[17,30],[17,70],[30,50],[40,50]];}
  else{slots=sorted.map((_,i)=>[25,(i+1)*100/(n+1)]);}
  return sorted.map((player,i)=>{const[lx,y]=slots[i]||[25,50];return{player,x:side==='left'?lx:100-lx,y};});
}

function openEditMatch(id){S.editingMatch={...S.matches.find(x=>x.id===id)};render();}
function closeEditMatch(){S.editingMatch=null;render();}
function saveEditedMatch(){
  const old=S.matches.find(x=>x.id===S.editingMatch.id);
  const newDate=document.getElementById('em-date').value.trim()||old.date;
  const newSA=Math.max(0,+document.getElementById('em-sA').value||0);
  const newSB=Math.max(0,+document.getElementById('em-sB').value||0);
  const newMvp=document.getElementById('em-mvp').value.trim();
  const newChron=document.getElementById('em-chron').value;
  const conf=Object.entries(old.players||{}).filter(([,s])=>s==='confirmed').map(([id])=>id);
  conf.forEach(pid=>{const i=S.players.findIndex(p=>p.id===pid);if(i<0)return;
    const onA=old.teamA?.includes(pid);const myO=onA?old.scoreA||0:old.scoreB||0,oppO=onA?old.scoreB||0:old.scoreA||0;
    const gf=old.ratings?.[pid]?.goals||0,gs=S.players[i].role==='Portiere'?oppO:0;
    S.players[i]={...S.players[i],G:Math.max(0,S.players[i].G-1),
      V:myO>oppO?Math.max(0,S.players[i].V-1):S.players[i].V,P:myO===oppO?Math.max(0,S.players[i].P-1):S.players[i].P,
      S:myO<oppO?Math.max(0,S.players[i].S-1):S.players[i].S,GF:Math.max(0,S.players[i].GF-gf),GS:Math.max(0,S.players[i].GS-gs)};});
  conf.forEach(pid=>{const i=S.players.findIndex(p=>p.id===pid);if(i<0)return;

function saveEditedScorers(){
  const m=S.matches.find(x=>x.id===S.editingScorers.id);

  const conf=Object.entries(m.players||{}).filter(([,s])=>s==='confirmed').map(([id])=>id);
  conf.forEach(pid=>{
    const i=S.players.findIndex(p=>p.id===pid);if(i<0)return;
    const oldGoals=m.ratings?.[pid]?.goals||0;
    const inp=document.getElementById('sg-'+pid);

  S.editingScorers=null;render();
}

/* ═══════════════════════════════════════
   HELPER STREAK — usato da Gloria e Stats
═══════════════════════════════════════ */
function playerMatchResults(playerId){
  function parseItDate(d){
    if(!d)return 0;
    const p=d.split(/[\/\s,:]+/);
    if(p.length>=3)return new Date(p[2],p[1]-1,p[0]).getTime();
    return 0;
  }
  // Ordina partite dalla più recente alla più vecchia
  const sorted=[...S.matches].sort((a,b)=>{
    const da=a.date?parseItDate(a.date):0;
    const db=b.date?parseItDate(b.date):0;
    return db-da;
  });
  return sorted.reduce((acc,m)=>{
    const conf=Object.entries(m.players||{}).filter(([,s])=>s==='confirmed').map(([id])=>id);
    if(!conf.includes(playerId))return acc;
    const onA=m.teamA?.includes(playerId);
    const myS=onA?(m.scoreA||0):(m.scoreB||0);
    const oppS=onA?(m.scoreB||0):(m.scoreA||0);
    acc.push({r:myS>oppS?'V':myS===oppS?'P':'S',date:m.date||'',scoreA:m.scoreA,scoreB:m.scoreB});
    return acc;
  },[]);
}
function currentStreak(results){
  if(!results.length)return{type:null,count:0};
  const type=results[0].r;let count=0;
  for(const r of results){if(r.r===type)count++;else break;}
  return{type,count};
}

/* ═══════════════════════════════════════
   🏅 GLORIA / VERGOGNA
═══════════════════════════════════════ */
function pgGloria(){
  if(!S.matches.length)return`<div style="max-width:640px;margin:0 auto;text-align:center;padding:4rem 1rem">
    <div style="font-size:56px;margin-bottom:16px">🏅</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">Nessun record ancora</div>
    <div class="muted">I record appariranno dopo la prima partita salvata</div>
  </div>`;

  const gloria=[],vergogna=[],curiosita=[];

  // Top scorer
  const ts=[...S.players].sort((a,b)=>b.GF-a.GF)[0];
  if(ts?.GF>0)gloria.push({e:'⚽',t:'<b>'+ts.name+'</b> è il capocannoniere con '+ts.GF+' gol stagionali'});

  // Most appearances
  const ta=[...S.players].sort((a,b)=>b.G-a.G)[0];
  if(ta?.G>0)gloria.push({e:'📅',t:'<b>'+ta.name+'</b> è il più presente: '+ta.G+' partite'});

  // Best media punti (min 5 partite)
  const mp=[...S.players].filter(p=>p.G>=5).sort((a,b)=>calcMediaP(b)-calcMediaP(a))[0];
  if(mp)gloria.push({e:'📊',t:'<b>'+mp.name+'</b> ha la miglior media punti: '+calcMediaP(mp).toFixed(3)});

  // MVP più volte
  const mvpCount={};
  S.matches.forEach(m=>{if(m.mvp)mvpCount[m.mvp]=(mvpCount[m.mvp]||0)+1;});
  const topMvp=Object.entries(mvpCount).sort((a,b)=>b[1]-a[1])[0];
  if(topMvp&&topMvp[1]>=2){const p=S.players.find(x=>x.id===topMvp[0]);if(p)gloria.push({e:'⭐',t:'<b>'+p.name+'</b> è stato MVP '+topMvp[1]+' volte questa stagione'});}

  // Record gol in una partita
  let maxGM={player:null,goals:0,date:''};
  S.matches.forEach(m=>{Object.entries(m.ratings||{}).forEach(([pid,r])=>{if((r.goals||0)>maxGM.goals){const p=S.players.find(x=>x.id===pid);if(p)maxGM={player:p,goals:r.goals,date:m.date};}});});
  if(maxGM.goals>=3)gloria.push({e:'💥',t:'<b>'+maxGM.player.name+'</b> record: '+maxGM.goals+' gol in una sola partita ('+maxGM.date+')'});

  // Streak vittorie / sconfitte / pareggi
  S.players.forEach(p=>{
    const res=playerMatchResults(p.id);
    const str=currentStreak(res);
    if(str.type==='V'&&str.count>=3)gloria.push({e:'🔥',t:'<b>'+p.name+'</b> imbattuto: '+str.count+' vittorie consecutive!'});
    if(str.type==='S'&&str.count>=3)vergogna.push({e:'😅',t:'<b>'+p.name+'</b> non ne azzecca una: '+str.count+' sconfitte di fila'});
    if(str.type==='P'&&str.count>=3)vergogna.push({e:'🤝',t:'<b>'+p.name+'</b> non vince mai: '+str.count+' pareggi consecutivi'});
  });

  // Portiere clean sheet streak
  S.players.filter(p=>p.role==='Portiere').forEach(p=>{
    let cs=0;
    for(const m of S.matches){
      const conf=Object.entries(m.players||{}).filter(([,s])=>s==='confirmed').map(([id])=>id);
      if(!conf.includes(p.id))break;
      const onA=m.teamA?.includes(p.id);
      const oppS=onA?(m.scoreB||0):(m.scoreA||0);
      if(oppS===0)cs++;else break;
    }
    if(cs>=2)gloria.push({e:'🧤',t:'<b>'+p.name+'</b> non subisce gol da '+cs+' partite consecutive'});
  });

  // Attaccanti/centrocampisti a secco
  S.players.filter(p=>p.role==='Attaccante'||p.role==='Centrocampista').forEach(p=>{
    let secco=0;
    for(const m of S.matches){
      const conf=Object.entries(m.players||{}).filter(([,s])=>s==='confirmed').map(([id])=>id);
      if(!conf.includes(p.id))continue;
      if((m.ratings?.[p.id]?.goals||0)>0)break;
      secco++;
    }
    if(secco>=5)vergogna.push({e:'🥶',t:'<b>'+p.name+'</b> non segna da '+secco+' partite consecutive'});
  });

  // Partita più pazza
  let crazy={total:0,date:'',sA:0,sB:0};
  S.matches.forEach(m=>{const t=(m.scoreA||0)+(m.scoreB||0);if(t>crazy.total)crazy={total:t,date:m.date,sA:m.scoreA,sB:m.scoreB};});
  if(crazy.total>=6)curiosita.push({e:'🎢',t:'Partita più pazza: '+crazy.sA+'–'+crazy.sB+' con '+crazy.total+' gol totali ('+crazy.date+')'});

  // Vittoria più larga
  let largo={diff:0,date:'',sA:0,sB:0};
  S.matches.forEach(m=>{const d=Math.abs((m.scoreA||0)-(m.scoreB||0));if(d>largo.diff)largo={diff:d,date:m.date,sA:m.scoreA,sB:m.scoreB};});
  if(largo.diff>=4)curiosita.push({e:'🏆',t:'Vittoria più larga: '+largo.sA+'–'+largo.sB+' ('+largo.date+')'});

  // Partita con 0-0
  const pariZero=S.matches.filter(m=>(m.scoreA||0)===0&&(m.scoreB||0)===0);
  if(pariZero.length>0)curiosita.push({e:'💤',t:pariZero.length+' pareggi 0–0 questa stagione'});

  function block(title,color,items){
    if(!items.length)return'';
    return`<div style="margin-bottom:20px">
      <div style="font-family:-apple-system,sans-serif;font-size:13px;font-weight:800;letter-spacing:2px;color:${color};
        border-bottom:3px solid ${color};padding-bottom:6px;margin-bottom:12px;text-transform:uppercase">${title}</div>
      ${items.map(r=>`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#111827;
        border-radius:10px;margin-bottom:6px;border-left:3px solid ${color}">
        <span style="font-size:22px;flex-shrink:0">${r.e}</span>
        <span style="font-size:14px;color:#d1d5db;line-height:1.5">${r.t}</span>
      </div>`).join('')}
    </div>`;
  }

  return`<div style="max-width:640px;margin:0 auto">
    <div style="text-align:center;padding:1rem 0 1.2rem">
      <div style="font-size:40px">🏅</div>
      <div style="font-size:20px;font-weight:900;color:#fbbf24">MURO GLORIA & VERGOGNA</div>
      <div style="font-size:11px;color:#6b7280;margin-top:4px">Stagione ${S.seasonName} · ${S.matches.length} partite</div>
    </div>
    ${!gloria.length&&!vergogna.length&&!curiosita.length
      ?'<div class="muted" style="text-align:center;padding:2rem">Servono più partite per generare i record!</div>'
      :block('🔥 Muro della Gloria','#16a34a',gloria)
       +block('😅 Muro della Vergogna','#dc2626',vergogna)
       +block('🎲 Curiosità','#f59e0b',curiosita)
    }
  </div>`;
}

              ${li.next?`<div style="font-size:9px;color:var(--mut)">${li.next.xp-li.xp} XP al prossimo</div>`:'<div style="font-size:9px;color:var(--yel)">⭐ MAX</div>'}
            </div>
            <div style="background:#1a2a1a;border-radius:99px;height:4px;overflow:hidden">
              <div style="width:${pct}%;background:${i===0?'linear-gradient(90deg,var(--grn2),var(--grn))':'var(--grn2)'};height:100%;border-radius:99px;transition:width .5s"></div>
            </div>
          </div>
        </div>`;
      }).join('')}

      <!-- Legenda livelli -->
      <div class="card" style="margin-top:4px">
        <div style="font-size:10px;color:var(--mut);letter-spacing:2px;margin-bottom:10px">TUTTI I LIVELLI</div>
        ${XP_TABLE.map(lv=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a2a1a;font-size:12px">
          <span style="color:var(--txt)">Lv.${lv.lv} <span style="font-weight:600">${lv.name}</span></span>
          <span style="color:var(--mut)">${lv.xp.toLocaleString()} XP</span>
        </div>`).join('')}
      </div>

      <!-- Regole XP -->
      <div class="card" style="margin-top:4px">
        <div style="font-size:10px;color:var(--mut);letter-spacing:2px;margin-bottom:10px">📋 COME SI GUADAGNANO GLI XP</div>

        <div style="font-size:11px;color:var(--grn);letter-spacing:1px;font-weight:700;margin-bottom:6px">GENERALI</div>
        ${[
          ['Presenza','+'+XP_RULES.presenza+'','📅'],
          ['Vittoria','+'+XP_RULES.vittoria,'🏆'],
          ['Pareggio','+'+XP_RULES.pareggio,'🤝'],
        ].map(([l,v,e])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1a2a1a;font-size:12px">
          <span style="color:var(--mut)">${e} ${l}</span>
          <span style="font-weight:700;color:var(--grn)">${v} XP</span>
        </div>`).join('')}

        <div style="font-size:11px;color:var(--grn);letter-spacing:1px;font-weight:700;margin:10px 0 6px">GOL PER RUOLO</div>
        ${[
          ['Attaccante','+'+XP_RULES.golAttaccante,'⚡'],
          ['Centrocampista','+'+XP_RULES.golCentrocampista,'⚙️'],
          ['Difensore','+'+XP_RULES.golDifensore,'🛡️'],
          ['Portiere','+'+XP_RULES.golPortiere,'🧤'],
        ].map(([l,v,e])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1a2a1a;font-size:12px">
          <span style="color:var(--mut)">${e} Gol ${l}</span>
          <span style="font-weight:700;color:var(--grn)">${v} XP</span>
        </div>`).join('')}

        <div style="font-size:11px;color:var(--grn);letter-spacing:1px;font-weight:700;margin:10px 0 6px">PORTIERE — GOL SUBITI</div>
        ${[
          ['0 – 2 gol subiti','+'+XP_RULES.golSubiti_02,'🧤'],
          ['3 – 4 gol subiti','+'+XP_RULES.golSubiti_34,'🧤'],
          ['5+ gol subiti','+'+XP_RULES.golSubiti_5,'🧤'],
          ['Parata decisiva','+'+XP_RULES.parataDec,'🧤'],
        ].map(([l,v,e])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1a2a1a;font-size:12px">
          <span style="color:var(--mut)">${e} ${l}</span>
          <span style="font-weight:700;color:var(--grn)">${v} XP</span>
        </div>`).join('')}

        <div style="font-size:11px;color:#f87171;letter-spacing:1px;font-weight:700;margin:10px 0 6px">PENALITÀ</div>
        ${[
          ['Autorete',''+XP_RULES.autorete,'🔴'],
          ['Rigore fallito',''+XP_RULES.rigoreFallito,'❌'],
        ].map(([l,v,e])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1a2a1a;font-size:12px">
          <span style="color:var(--mut)">${e} ${l}</span>
          <span style="font-weight:700;color:#f87171">${v} XP</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // ── PROFILO RPG GIOCATORE ──
  const xp=calcPlayerXP(p.id);
  const li=getLevelInfo(xp);
  const badges=calcBadges(p.id);
  const col=RCOL[p.role]||'var(--mut)';
  const ph=playerPhoto(p.name);
  const rank=ranking.findIndex(x=>x.id===p.id)+1;

  // XP breakdown
  let breakdown=[];
  S.matches.forEach(m=>{
    if(m.players?.[p.id]!=='confirmed')return;
    const onA=m.teamA?.includes(p.id);
    const myS=onA?(m.scoreA||0):(m.scoreB||0);
    const oppS=onA?(m.scoreB||0):(m.scoreA||0);
    let mx=XP_RULES.presenza;
    if(myS>oppS)mx+=XP_RULES.vittoria;
    else if(myS===oppS)mx+=XP_RULES.pareggio;
    const goals=m.ratings?.[p.id]?.goals||0;
    if(goals>0){
      const rule=p.role==='Attaccante'?XP_RULES.golAttaccante:
                 p.role==='Centrocampista'?XP_RULES.golCentrocampista:
                 p.role==='Difensore'?XP_RULES.golDifensore:XP_RULES.golPortiere;
      mx+=goals*rule;
    }
    if(p.role==='Portiere'){
      const c=onA?(m.scoreB||0):(m.scoreA||0);
      mx+=c<=2?XP_RULES.golSubiti_02:c<=4?XP_RULES.golSubiti_34:XP_RULES.golSubiti_5;
    }
    breakdown.push({date:m.date,xp:mx,goals});
  });
  breakdown.sort((a,b)=>{
    const pa=a.date?a.date.split('/').reverse().join(''):'';
    const pb=b.date?b.date.split('/').reverse().join(''):'';
    return pb.localeCompare(pa);
  });

  return `<div style="max-width:640px;margin:0 auto">
    <button onclick="S.rpgPlayer=null;render()" style="background:none;border:none;color:var(--mut);font-size:13px;cursor:pointer;margin-bottom:12px;padding:0">‹ Classifica</button>

    <!-- Hero card -->
    <div style="background:linear-gradient(135deg,#0d2a0d,#0a1f0a);border:1px solid #1e4a1e;border-radius:16px;padding:16px;margin-bottom:12px">
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">
        <div style="position:relative;flex-shrink:0">
          <div style="width:68px;height:68px;border-radius:50%;overflow:hidden;border:3px solid ${col};display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--bg3)">
            <img src="cards/${ph}" style="width:100%;height:100%;object-fit:cover" onerror="this.hidden=true"/>
            ${RICON[p.role]}
          </div>
          <div style="position:absolute;bottom:-4px;right:-4px;background:var(--grn2);color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:99px;border:2px solid #0a0a0a">
            ${li.lv}
          </div>
        </div>
        <div style="flex:1">
          <div style="font-size:20px;font-weight:900">${p.name}</div>
          <div style="font-size:11px;color:${col};font-weight:700;margin-top:2px">${p.role.toUpperCase()} · #${rank} in classifica</div>
          <div style="font-size:22px;font-weight:900;color:var(--grn);margin-top:4px">${li.name.toUpperCase()}</div>
        </div>
        <div style="text-align:center;flex-shrink:0">
          <div style="font-size:32px;font-weight:900;color:var(--grn)">${xp}</div>
          <div style="font-size:9px;color:var(--mut);letter-spacing:1px">XP TOTALI</div>
        </div>
      </div>

      <!-- Barra XP -->
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:4px">
        <span>Lv.${li.lv} ${li.name}</span>
        ${li.next?`<span>Lv.${li.next.lv} ${li.next.name} — ${li.next.xp-xp} XP mancanti</span>`:'<span style="color:var(--yel)">⭐ LIVELLO MASSIMO</span>'}
      </div>
      <div style="background:#1a3a1a;border-radius:99px;height:8px;overflow:hidden">
        <div style="width:${li.pct}%;background:linear-gradient(90deg,var(--grn2),var(--grn));height:100%;border-radius:99px;transition:width .6s"></div>
      </div>
      <div style="text-align:right;font-size:10px;color:var(--grn);margin-top:3px">${li.pct}%</div>
    </div>

    <!-- Badge -->
    ${badges.length>0?`<div class="card">
      <div style="font-size:10px;color:var(--mut);letter-spacing:2px;margin-bottom:10px">BADGE SBLOCCATI</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${badges.map(b=>`<div style="background:#0d2a0d;border:1px solid #1e4a1e;border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:6px">
          <span style="font-size:20px">${b.e}</span>
          <div>
            <div style="font-size:12px;font-weight:700">${b.n}</div>
            <div style="font-size:10px;color:var(--mut)">${b.d}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>`:''}

    <!-- Storico XP per partita -->
    <div class="card">
      <div style="font-size:10px;color:var(--mut);letter-spacing:2px;margin-bottom:10px">XP PER PARTITA</div>
      ${breakdown.map(b=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #1a2a1a;font-size:13px">
        <span style="color:var(--mut)">${b.date}</span>
        <div style="display:flex;gap:8px;align-items:center">
          ${b.goals>0?`<span style="font-size:11px;color:#f59e0b">⚽×${b.goals}</span>`:''}
        </div>
        <span style="font-weight:700;color:var(--grn)">+${b.xp} XP</span>
      </div>`).join('')}
      <div style="display:flex;justify-content:space-between;padding-top:10px;font-weight:700">
        <span style="color:var(--txt)">Totale</span>
        <span style="color:var(--grn);font-size:16px">${xp} XP</span>
      </div>
    </div>

    <!-- Legenda XP guadagnati -->
    <div class="card">
      <div style="font-size:10px;color:var(--mut);letter-spacing:2px;margin-bottom:10px">COME GUADAGNI XP</div>
      ${[
        ['Presenza','+'+XP_RULES.presenza,''],
        ['Vittoria','+'+XP_RULES.vittoria,''],
        ['Pareggio','+'+XP_RULES.pareggio,''],
        ['Gol ('+p.role+')','+'+{Attaccante:XP_RULES.golAttaccante,Centrocampista:XP_RULES.golCentrocampista,Difensore:XP_RULES.golDifensore,Portiere:XP_RULES.golPortiere}[p.role],'⚽'],
        ...(p.role==='Portiere'?[
          ['Gol subiti 0-2','+'+XP_RULES.golSubiti_02,'🧤'],
          ['Gol subiti 3-4','+'+XP_RULES.golSubiti_34,'🧤'],
          ['Gol subiti 5+','+'+XP_RULES.golSubiti_5,'🧤'],
        ]:[]),
        ['Autorete',''+XP_RULES.autorete,'🔴'],
        ['Rigore fallito',''+XP_RULES.rigoreFallito,'❌'],
      ].map(([l,v,e])=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a2a1a;font-size:12px">
        <span style="color:var(--mut)">${e} ${l}</span>
        <span style="font-weight:700;color:${v.startsWith('-')?'#f87171':'var(--grn)'}">${v} XP</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function pgStats(){
  const sel=S.statsPlayer;
  const p=sel?S.players.find(x=>x.id===sel):null;
  const RCOL={Portiere:'#60a5fa',Difensore:'#4ade80',Centrocampista:'#fbbf24',Attaccante:'#f87171'};

  const list=`<div style="max-width:640px;margin:0 auto">
    <div style="font-weight:700;font-size:16px;margin-bottom:12px">📊 Statistiche Giocatori</div>
    <div style="font-size:12px;color:#6b7280;margin-bottom:12px">Tocca un giocatore per vedere il suo profilo</div>
    ${ROLES.map(role=>{
      const ps=S.players.filter(x=>x.role===role);if(!ps.length)return'';
      return`<div style="font-size:10px;color:#6b7280;letter-spacing:1px;margin:8px 0 4px">${RICON[role]} ${role.toUpperCase()}</div>`+
      ps.map(pl=>`<div onclick="S.statsPlayer='${pl.id}';render()"
        style="background:#111827;border:1px solid #1f2937;border-radius:10px;padding:10px 12px;
          display:flex;align-items:center;gap:10px;margin-bottom:4px;cursor:pointer">
        <span style="font-size:20px">${RICON[pl.role]}</span>
        <div style="flex:1">
          <div style="font-weight:700;font-size:14px">${pl.name}</div>
          <div style="font-size:11px;color:#6b7280">G:${pl.G} V:${pl.V} P:${pl.P} S:${pl.S} ⚽${pl.GF}</div>
        </div>
        <span style="color:#374151;font-size:18px">›</span>
      </div>`).join('');
    }).join('')}
  </div>`;

  if(!p)return list;

  // Profilo giocatore
  const col=RCOL[p.role]||'#9ca3af';
  const res=playerMatchResults(p.id); // newest first
  const last5=res.slice(0,5);
  const mp=calcMediaP(p);
  const str=currentStreak(res);
  const streakLabel=str.type==='V'?'🔥 '+str.count+' vittorie di fila':str.type==='S'?'😅 '+str.count+' sconfitte di fila':str.type==='P'?'🤝 '+str.count+' pareggi di fila':'';

  // Max values per barre proporzionali
  const maxG=Math.max(...S.players.map(x=>x.G),1);
  const maxV=Math.max(...S.players.map(x=>x.V),1);
  const maxGF=Math.max(...S.players.map(x=>x.GF),1);
  const maxMP=Math.max(...S.players.filter(x=>x.G>=5).map(x=>calcMediaP(x)),1);

  function bar(label,val,maxVal,color){
    const pct=maxVal>0?Math.round((val/maxVal)*100):0;
    return`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:12px;color:#9ca3af">${label}</span>
        <span style="font-size:13px;font-weight:700;color:${color}">${val}</span>
      </div>
      <div style="background:#1f2937;border-radius:4px;height:10px;overflow:hidden">
        <div style="width:${pct}%;background:${color};height:100%;border-radius:4px;transition:width .3s"></div>
      </div>
    </div>`;
  }

  const ph=playerPhoto(p.name);

  return`<div style="max-width:640px;margin:0 auto">
    <button onclick="S.statsPlayer=null;render()" style="background:none;border:none;color:#6b7280;font-size:13px;cursor:pointer;margin-bottom:12px;padding:0">‹ Tutti i giocatori</button>

    <!-- Header profilo -->
    <div style="background:linear-gradient(135deg,#052e16,#0a3d1a);border:1px solid #14532d;border-radius:16px;padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:center">
      <div style="position:relative;flex-shrink:0">
        <div style="width:64px;height:64px;border-radius:50%;background:${col}18;border:3px solid ${col};
          display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden">
          <img src="${ph}" style="width:100%;height:100%;object-fit:cover;display:none"
            onload="this.style.display='block';this.previousElementSibling&&(this.previousElementSibling.style.display='none')"
            onerror="this.style.display='none'"/>
          ${RICON[p.role]}
        </div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:20px;font-weight:900;letter-spacing:1px">${p.name.toUpperCase()}</div>
        <div style="font-size:11px;font-weight:700;color:${col};margin-top:2px">${p.role.toUpperCase()}</div>
        ${streakLabel?`<div style="font-size:12px;color:#fbbf24;margin-top:4px">${streakLabel}</div>`:''}
      </div>
      <div style="text-align:center;flex-shrink:0">
        <div style="font-size:28px;font-weight:900;color:#fbbf24">${mp.toFixed(2)}</div>
        <div style="font-size:9px;color:#6b7280;letter-spacing:1px">MEDIA</div>
      </div>
    </div>

    <!-- Barre statistiche -->
    <div class="card">
      <div style="font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:1px;margin-bottom:12px">STAGIONE ${S.seasonName}</div>
      ${bar('📅 Presenze',p.G,maxG,'#60a5fa')}
      ${bar('🏆 Vittorie',p.V,maxV,'#4ade80')}
      ${bar('⚽ Gol',p.GF,maxGF,'#f59e0b')}
      ${p.role==='Portiere'?bar('🧤 Gol Salvati',p.GS,Math.max(...S.players.map(x=>x.GS),1),'#a78bfa'):''}
      ${p.G>=5?bar('📊 Media Punti',+mp.toFixed(3),+maxMP.toFixed(3),'#f87171'):''}
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid #1f2937">
        ${[['G',p.G,'Partite','#60a5fa'],['V',p.V,'Vittorie','#4ade80'],['P',p.P,'Pareggi','#9ca3af'],['S',p.S,'Sconfitte','#f87171']].map(([l,v,n,c])=>`
          <div style="text-align:center;background:#0a0f1a;border-radius:8px;padding:8px 4px">
            <div style="font-size:22px;font-weight:900;color:${c}">${v}</div>
            <div style="font-size:9px;color:#6b7280;letter-spacing:.5px">${n.toUpperCase()}</div>
          </div>`).join('')}
      </div>
    </div>

    <!-- Ultimi 5 risultati -->
    ${last5.length>0?`<div class="card">
      <div style="font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:1px;margin-bottom:10px">ULTIMI ${last5.length} RISULTATI</div>
      <div style="font-size:9px;color:#6b7280;letter-spacing:.5px;margin-bottom:8px;text-align:right">← più vecchio · più recente →</div>
      <div style="display:flex;gap:6px">
        ${[...last5].reverse().map(obj=>{
          const c=obj.r==='V'?'var(--grn2)':obj.r==='P'?'#374151':'#dc2626';
          const dd=obj.date?obj.date.substring(0,5):'';
          return`<div style="flex:1;text-align:center">
            <div style="padding:10px 4px;background:${c};border-radius:8px;font-size:18px;font-weight:900;color:#fff">${obj.r}</div>
            ${dd?`<div style="font-size:9px;color:#6b7280;margin-top:3px">${dd}</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`:''}

    <!-- Gol per partita -->
    ${(() => {
      const gols=S.matches.filter(m=>{
        const conf=Object.entries(m.players||{}).filter(([,s])=>s==='confirmed').map(([id])=>id);
        return conf.includes(p.id)&&(m.ratings?.[p.id]?.goals||0)>0;
      });
      if(!gols.length)return'';
      return`<div class="card">
        <div style="font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:1px;margin-bottom:10px">⚽ PARTITE CON GOL</div>
        ${gols.slice(0,8).map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1f2937;font-size:13px">
          <span style="color:#9ca3af">${m.date}</span>
          <span style="font-size:11px">${m.scoreA}–${m.scoreB}</span>
          <span style="font-weight:700;color:#f59e0b">${'⚽'.repeat(m.ratings[p.id].goals)} <span style="font-size:11px;color:#6b7280">×${m.ratings[p.id].goals}</span></span>
        </div>`).join('')}
      </div>`;
    })()}
  </div>`;
}

      <div style="font-size:22px;font-weight:800;color:#4ade80">Football Friday</div>
      <div style="color:#6b7280;font-size:13px">Caricamento dati...</div>
    </div>`;
  try{
    load();   /* sincrono — istantaneo */
    render(); /* app visibile subito */

      setInterval(()=>{if(!document.hidden&&!S.captainMode)refreshData();},60000);

      </div>`;
  }
})();
